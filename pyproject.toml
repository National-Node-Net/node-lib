[build-system]
requires = ["setuptools>=61.2.0", "wheel==0.48.0", "pip-tools==7.6.1"]
build-backend = "setuptools.build_meta"

[project]
name = "node-lib"
version = "3.1.1"
authors = [{name = "National Digital Twin Programme"}]
description = "A helper package for building Adapters, Mappers and Projectors for Integration Architecture Node"
requires-python = ">=3.9"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = [
    "colored==2.3.2",
    "rdflib==7.6.0",
    "Werkzeug==3.1.9",
    "PyJWT==2.15.1",
    "requests==2.34.2",
    "pytz==2026.5",
    "confluent-kafka==2.15.1",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0"
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.9.4",
    "types-pytz==2026.4.0.20260926",
    "urllib3==2.8.0",
    "types-requests==2.33.0.20260906",
    "mypy==2.4.0",
    "mkdocs==1.6.1",
    "cyclonedx-bom==7.5.0"
]

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[tool.ruff]
target-version = "py39"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "C901", # too complex
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
line-length = 120

[project.urls]
Repository = "https://github.com/National-Node-Net/node-lib"

[tool.distutils.bdist_wheel]
universal = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["ia_map_lib*"]
namespaces = true

[tool.setuptools.package-data]
"ia_map_lib" = ["sbom.json"]

[tool.mypy]
no_implicit_optional = false
ignore_missing_imports = true
modules = ["ia_map_lib", "tests", "debug"]
