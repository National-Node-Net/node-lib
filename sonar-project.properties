# Must be unique in a given SonarQube instance
sonar.projectKey=node-lib


# This is the name and version displayed in the SonarQube UI.
# Was mandatory prior to SonarQube 6.1.
sonar.projectName=node-lib
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file.
sonar.sources=ia_map_lib/

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

sonar.issue.ignore.multicriteria=e1,e2
# python:S3776 : Cognitive Complexity of functions should not be too high
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/ia_map_lib/mapper.py

sonar.issue.ignore.multicriteria.e2.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/ia_map_lib/utils.py




